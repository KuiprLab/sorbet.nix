name: "Deploy Configuration"
on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.17.0
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes

      - name: Write SSH keys
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./id_rsa
          chmod 600 ./id_rsa

      - name: Deploy
        run: |
            nix-env -i openssH
            nix run nixpkgs#deploy-rs -- --remote-build --ssh-opts "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ./id_rsa" .#"sorbet" 
        env:
          NIX_CONFIG: |
            experimental-features = nix-command flakes
